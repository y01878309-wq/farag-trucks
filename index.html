    <style>
        * {
            box-sizing: border-box;

<body>

<div id="game-container">
    <!-- Main Menu -->
    <div id="main-menu" class="screen">
        <h1>FARAG TRUCKS</h1>
        <p>محاكاة شاحنات فرج الاحترافية - الإصدار الشامل</p>
        <button class="main-btn" onclick="startGame()">ابدأ القيادة الآن</button>
    </div>

    <!-- Pause / Game Over Screen -->
    <div id="game-over-screen" class="screen" style="display: none;">
        <h1 id="screen-title">انتهت الرحلة</h1>
        <p id="screen-desc">لقد اصطدمت بالحاجز أو نفذ وقودك!</p>
        <button class="main-btn" onclick="restartGame()">العب مرة أخرى</button>
    </div>

    <!-- HUD Elements -->
    <div class="hud-panel" id="hud" style="display: none;">
        <div class="hud-card">السرعة: <span id="speed-val">0</span> كم/س</div>
        <div class="hud-card">المسافة: <span id="dist-val">0</span> كم</div>
        <div class="hud-card">الوقود: <span id="fuel-val">100</span>%</div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Touch Controls -->
    <div class="controls-overlay" id="controls" style="display: none;">
        <div class="control-group">
            <div class="btn-game" id="btn-left">◀</div>
            <div class="btn-game" id="btn-right">▶</div>
        </div>
        <div class="control-group">
            <div class="btn-game btn-brake" id="btn-brake">🛑</div>
            <div class="btn-game" id="btn-gas">🚀</div>
        </div>
    </div>
</div>

<script>
    /* Farag Trucks Comprehensive Core Engine */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let scoreDistance = 0;
    let fuel = 100;
    let speed = 0;
    let maxSpeed = 12;
    let acceleration = 0.15;
    let friction = 0.08;
    let steering = 0;

    let truck = {
        x: 0,
        y: 0,
        width: 60,
        height: 110,
        angle: 0
    };

    let roadWidth = 400;
    let obstacles = [];
    let scenery = [];
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        truck.x = canvas.width / 2;
        truck.y = canvas.height - 200;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Input States
    const keys = { left: false, right: false, gas: false, brake: false };

    // Setup Touch Listeners for Controls
    function bindTouch(id, keyName) {
        const el = document.getElementById(id);
        if(!el) return;
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
        el.addEventListener('mousedown', (e) => { e.preventDefault(); keys[keyName] = true; });
        el.addEventListener('mouseup', (e) => { e.preventDefault(); keys[keyName] = false; });
    }

    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-gas', 'gas');
    bindTouch('btn-brake', 'brake');

    // Keyboard support for testing
    window.addEventListener('keydown', (e) => {
        if(e.key === 'ArrowLeft') keys.left = true;
        if(e.key === 'ArrowRight') keys.right = true;
        if(e.key === 'ArrowUp') keys.gas = true;
        if(e.key === 'ArrowDown') keys.brake = true;
    });
    window.addEventListener('keyup', (e) => {
        if(e.key === 'ArrowLeft') keys.left = false;
        if(e.key === 'ArrowRight') keys.right = false;
        if(e.key === 'ArrowUp') keys.gas = false;
        if(e.key === 'ArrowDown') keys.brake = false;
    });

    function startGame() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('controls').style.display = 'flex';
        
        gameState = 'PLAYING';
        scoreDistance = 0;
        fuel = 100;
        speed = 0;
        obstacles = [];
        scenery = [];
        truck.x = canvas.width / 2;
        
        // Generate initial scenery
        for(let i=0; i<10; i++) {
            scenery.push({
                y: i * 150 - 200,
                side: Math.random() > 0.5 ? 1 : -1,
                type: Math.floor(Math.random() * 3)
            });
        }
    }

    function gameOver(reason) {
        gameState = 'GAMEOVER';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('controls').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'flex';
        document.getElementById('screen-title').innerText = reason;
        document.getElementById('screen-desc').innerText = `المسافة المقطوعة: ${(scoreDistance/1000).toFixed(2)} كم`;
    }

    function restartGame() {
        startGame();
    }

    // Game Loop Update
    function update() {
        if(gameState !== 'PLAYING') return;

        // Speed logic
        if(keys.gas) {
            speed += acceleration;
            fuel -= 0.015;
        } else if(keys.brake) {
            speed -= acceleration * 1.5;
        } else {
            speed -= friction;
        }

        if(speed > maxSpeed) speed = maxSpeed;
        if(speed < 0) speed = 0;

        // Steering logic
        let roadLeftEdge = (canvas.width / 2) - (roadWidth / 2);
        let roadRightEdge = (canvas.width / 2) + (roadWidth / 2);

        if(keys.left) {
            truck.x -= 6;
            steering = -0.05;
        } else if(keys.right) {
            truck.x += 6;
            steering = 0.05;
        } else {
            steering = 0;
        }

        // Boundary Check (Off-road penalty)
        if(truck.x < roadLeftEdge + 30 || truck.x > roadRightEdge - 30) {
            speed *= 0.95; // Slow down in dirt
        }

        if(fuel <= 0) {
            gameOver('نفد الوقود!');
        }

        scoreDistance += speed;

        // Spawn obstacles
        if(Math.random() < 0.02 + (speed * 0.001)) {
            let obsX = roadLeftEdge + 50 + Math.random() * (roadWidth - 100);
            obstacles.push({
                x: obsX,
                y: -100,
                width: 50,
                height: 80,
                type: Math.random() > 0.4 ? 'car' : 'barrier'
            });
        }

        // Update obstacles
        for(let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].y += speed;

            // Collision detection
            let dx = truck.x - obstacles[i].x;
            let dy = truck.y - obstacles[i].y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if(dist < 55) {
                gameOver('حدث اصطدام مروري!');
            }

            // Remove out of screen
            if(obstacles[i].y > canvas.height + 150) {
                obstacles.splice(i, 1);
            }
        }

        // Update scenery
        for(let s of scenery) {
            s.y += speed;
            if(s.y > canvas.height + 100) {
                s.y = -200;
                s.side = Math.random() > 0.5 ? 1 : -1;
            }
        }

        // Update HUD display
        document.getElementById('speed-val').innerText = Math.round(speed * 12);
        document.getElementById('dist-val').innerText = (scoreDistance / 1000).toFixed(2);
        document.getElementById('fuel-val').innerText = Math.max(0, Math.round(fuel));
    }

    // Render Graphics
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if(gameState !== 'PLAYING') return;

        let roadLeftEdge = (canvas.width / 2) - (roadWidth / 2);
        let roadRightEdge = (canvas.width / 2) + (roadWidth / 2);

        // Draw Grass Background
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Road
        ctx.fillStyle = '#34495e';
        ctx.fillRect(roadLeftEdge, 0, roadWidth, canvas.height);

        // Road Shoulders
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(roadLeftEdge - 15, 0, 15, canvas.height);
        ctx.fillRect(roadRightEdge, 0, 15, canvas.height);

        // Center dashed lines
        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 6;
        ctx.setLineDash([40, 40]);
        ctx.lineDashOffset = -scoreDistance * 2;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]); // Reset

        // Draw Scenery (Trees / Rocks)
        for(let s of scenery) {
            let sx = s.side === 1 ? roadRightEdge + 40 : roadLeftEdge - 70;
            ctx.fillStyle = '#1e8449';
            ctx.beginPath();
            ctx.arc(sx, s.y, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#78281f';
            ctx.fillRect(sx - 5, s.y + 15, 10, 25);
        }

        // Draw Obstacles
        for(let obs of obstacles) {
            ctx.save();
            ctx.translate(obs.x, obs.y);
            if(obs.type === 'car') {
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(-25, -40, 50, 90);
                // Windshield
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(-20, -20, 40, 25);
            } else {
                ctx.fillStyle = '#7f8c8d';
                ctx.fillRect(-25, -25, 50, 50);
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(-25, -5, 50, 10);
            }
            ctx.restore();
        }

        // Draw Farag Truck (The Player)
        ctx.save();
        ctx.translate(truck.x, truck.y);
        ctx.rotate(steering);

        // Truck Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(-32, -55, 64, 120);

        // Cabin (رأس الشاحنة)
        ctx.fillStyle = '#2980b9';
        ctx.fillRect(-28, -50, 56, 75);
        
        // Windshield (زجاج الشاحنة)
        ctx.fillStyle = '#111';
        ctx.fillRect(-22, -40, 44, 25);

        // Cargo Trailer (المقطورة الخلفية)
        ctx.fillStyle = '#e67e22';
        ctx.fillRect(-32, 25, 64, 85);
        ctx.strokeStyle = '#d35400';
        ctx.lineWidth = 3;
        ctx.strokeRect(-32, 25, 64, 85);

        // Headlights
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(-25, -52, 10, 6);
        ctx.fillRect(15, -52, 10, 6);

        ctx.restore();
    }

    // Main Engine Loop
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // Initialize animation frame
    loop();
</script>

</body>
</html>
